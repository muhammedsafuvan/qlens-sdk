
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queuelens"
version = "0.1.1"
description = "Python SDK for background job observability and Celery instrumentation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.0",
]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
celery = [
    "celery>=5.6.3",
]
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.17.0",
    "celery>=5.6.3",
    "twine>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/muhammedsafuvan/qlens-sdk"
Repository = "https://github.com/muhammedsafuvan/qlens-sdk"
Issues = "https://github.com/muhammedsafuvan/qlens-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["queuelens"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.venv",
    "/.venv-test",
    "/.git",
    "/dist",
    "/build",
    "**/__pycache__",
    "**/*.py[cod]",
]
